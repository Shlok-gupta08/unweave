name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.1)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Package macOS App & DMG Installer
        run: |
          bash scripts/package-mac.sh

      - name: Verify DMG Artifact
        run: |
          ls -lh dist-desktop/Unweave.dmg
          echo "DMG Size: $(du -sh dist-desktop/Unweave.dmg | cut -f1)"

      - name: Publish DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          name: Unweave Studio ${{ github.ref_name || github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-desktop/Unweave.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
