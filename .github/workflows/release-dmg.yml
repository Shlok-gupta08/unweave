name: Build & Release Desktop Apps (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.1)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Desktop Installers
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Package macOS App & DMG Installer
        run: |
          bash scripts/package-mac.sh

      - name: Package Windows App (.exe) Distribution
        run: |
          bash scripts/package-win.sh

      - name: Verify Release Artifacts
        run: |
          ls -lh dist-desktop/Unweave.dmg
          ls -lh dist-desktop/Unweave-Windows-x64.zip
          echo "macOS DMG Size: $(du -sh dist-desktop/Unweave.dmg | cut -f1)"
          echo "Windows ZIP Size: $(du -sh dist-desktop/Unweave-Windows-x64.zip | cut -f1)"

      - name: Publish macOS DMG & Windows Package to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          name: Unweave Studio ${{ github.ref_name || github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-desktop/Unweave.dmg
            dist-desktop/Unweave-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

